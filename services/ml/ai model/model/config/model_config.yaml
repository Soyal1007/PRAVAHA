# NER-SHIELD Model Configuration
# Satellite Image Analysis for Road Disruption Detection in Northeast India

project:
  name: "NER-SHIELD"
  version: "1.0.0"
  description: "AI-powered satellite image analysis for detecting road disruptions, landslides, floods, and infrastructure damage"
  target_region: "Northeast India"

# Shared backbone configuration
backbone:
  name: "efficientnet_b4"
  pretrained: true
  pretrained_weights: "imagenet"
  in_channels: 3
  features_dim: 1792  # EfficientNet-B4 final feature dimension
  freeze_bn: false
  drop_rate: 0.2
  drop_path_rate: 0.2

# Input configuration
input:
  image_size: 512
  channels: 3
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# Classification model
classification:
  num_classes: 6
  classes:
    - "landslide"
    - "flood"
    - "road_damage"
    - "infrastructure_damage"
    - "vegetation_loss"
    - "normal"
  class_weights:
    landslide: 2.5
    flood: 2.0
    road_damage: 3.0
    infrastructure_damage: 3.5
    vegetation_loss: 1.5
    normal: 0.5
  head:
    hidden_dim: 512
    dropout_1: 0.3
    dropout_2: 0.2
    use_batchnorm: true
  loss:
    type: "focal"
    gamma: 2.0
    alpha_weighted: true

# Segmentation model
segmentation:
  num_classes: 5
  classes:
    - "background"
    - "landslide_scar"
    - "flood_water"
    - "damaged_road"
    - "damaged_structure"
  architecture: "unetplusplus"
  encoder_name: "efficientnet-b4"
  encoder_weights: "imagenet"
  decoder_channels: [256, 128, 64, 32, 16]
  decoder_attention_type: "scse"
  loss:
    dice_weight: 0.5
    focal_weight: 0.5
    focal_gamma: 2.0

# Change detection model (Siamese)
change_detection:
  encoder_name: "efficientnet_b4"
  pretrained: true
  fusion_method: "concatenation_attention"
  attention:
    type: "channel_spatial"
    reduction_ratio: 16
  fpn:
    out_channels: 256
    num_levels: 4
  decoder:
    channels: [256, 128, 64, 32]
  outputs:
    change_mask: true
    change_type_classes: 6  # same as classification classes
    magnitude_score: true   # 0-100
    affected_area: true     # in km2

# Anomaly detector (VAE)
anomaly_detector:
  latent_dim: 256
  encoder_channels: [32, 64, 128, 256, 512]
  decoder_channels: [512, 256, 128, 64, 32]
  kl_weight: 0.0005
  reconstruction_loss: "mse"
  anomaly_threshold_percentile: 95
  score_range: [0, 100]
  input_size: 256  # smaller for VAE efficiency

# Severity levels
severity:
  levels:
    - name: "none"
      range: [0, 10]
      color: "#00FF00"
    - name: "low"
      range: [10, 30]
      color: "#FFFF00"
    - name: "moderate"
      range: [30, 60]
      color: "#FFA500"
    - name: "high"
      range: [60, 80]
      color: "#FF4500"
    - name: "critical"
      range: [80, 100]
      color: "#FF0000"

# GSD (Ground Sampling Distance) for area calculations
geo:
  default_gsd_meters: 10.0  # Sentinel-2 resolution
  supported_crs: ["EPSG:4326", "EPSG:32646", "EPSG:32647"]  # Northeast India UTM zones
  default_crs: "EPSG:4326"
