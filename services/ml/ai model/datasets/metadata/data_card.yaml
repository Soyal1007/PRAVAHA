# -----------------------------------------------------------------------------
# Dataset Split
# -----------------------------------------------------------------------------
split:
  strategy: "stratified with geographic-aware grouping"
  ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  constraints:
    - "Stratified by class label"
    - "Geographic groups (~10km grid cells) kept in same split"
    - "Before/after pairs kept in same split (pair cohesion)"
    - "No geographic overlap between train/val/test (leakage prevention)"
  output_format:
    structure: "train/val/test directories with class subdirectories"
    statistics_file: "split_statistics.json"

# -----------------------------------------------------------------------------
# Quality Validation
# -----------------------------------------------------------------------------
validation:
  checks:
    - name: "file_exists"
      description: "Verify file exists on disk"
    - name: "file_readable"
      description: "Verify file can be opened and decoded"
    - name: "min_dimensions"
      description: "Minimum 32x32 pixels"
      threshold: 32
    - name: "aspect_ratio"
      description: "Aspect ratio between 0.25 and 4.0"
      min_ratio: 0.25
      max_ratio: 4.0
    - name: "all_black"
      description: "Detect all-black/zero-value images"
    - name: "all_white"
      description: "Detect all-white/saturated images"
    - name: "zero_variance"
      description: "Detect constant-value images"
    - name: "missing_georef"
      description: "Check for missing georeference (CRS/transform)"
    - name: "nan_inf"
      description: "Detect NaN or Inf values in raster bands"
  thresholds:
    minimum_validity_rate: 0.90
    class_imbalance_warning_ratio: 10.0

# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------
scripts:
  download:
    - path: "scripts/download_isro.py"
      description: "Download ISRO Bhuvan data via WCS/WFS/WMS/ODA"
      requires: ["requests"]
    - path: "scripts/download_imd.py"
      description: "Download IMD weather data (station, gridded, extreme events)"
      requires: ["requests", "numpy"]
    - path: "scripts/download_kaggle.py"
      description: "Download Kaggle datasets via kaggle CLI API"
      requires: ["kaggle"]
    - path: "scripts/download_github.py"
      description: "Clone GitHub repos with dataset extraction"
      requires: ["git"]
    - path: "scripts/download_sentinel.py"
      description: "Download Sentinel/Copernicus data via CDSE OData API"
      requires: ["requests", "sentinelsat (optional)"]
    - path: "scripts/download_landsat.py"
      description: "Download Landsat/SRTM via USGS M2M API"
      requires: ["requests", "landsatxplore (optional)"]
  processing:
    - path: "scripts/preprocess_pipeline.py"
      description: "8-stage preprocessing pipeline (format, CRS, resolution, bands, radiometric, cloud, label, validate)"
      requires: ["rasterio", "numpy", "opencv-python", "Pillow"]
    - path: "scripts/augmentation.py"
      description: "Data augmentation with albumentations and custom Mixup/CutMix"
      requires: ["albumentations", "numpy", "opencv-python"]
    - path: "scripts/create_before_after_pairs.py"
      description: "Generate before/after temporal pairs for 18 NER disaster events"
      requires: ["requests", "rasterio", "numpy"]
    - path: "scripts/split_dataset.py"
      description: "Stratified geographic-aware train/val/test split"
      requires: ["numpy", "rasterio (optional)"]
    - path: "scripts/validate_dataset.py"
      description: "Comprehensive dataset quality validation (9 checks)"
      requires: ["numpy", "Pillow", "rasterio (optional)"]

# -----------------------------------------------------------------------------
# Known Limitations
# -----------------------------------------------------------------------------
limitations:
  - "Cloud cover is prevalent in NER during monsoon (June-September), limiting optical imagery availability"
  - "SAR data from RISAT-1 has limited historical archive compared to Sentinel-1"
  - "Some Kaggle datasets (xBD, CrisisMMD) are non-commercial use only"
  - "RESISC-45 and PatternNet are restricted to research use"
  - "ISRO Bhuvan data availability varies by sensor and time period"
  - "IMD station density is sparse in Arunachal Pradesh and Nagaland"
  - "Before/after pairs depend on cloud-free Sentinel-2 availability near event dates"
  - "Synthetic pairs approximate but do not perfectly replicate real disaster signatures"
  - "Class distribution may be imbalanced — normal class likely dominates"
  - "Geographic coverage of labeled data is uneven across the 8 NER states"

# -----------------------------------------------------------------------------
# Ethical Considerations
# -----------------------------------------------------------------------------
ethics:
  intended_use: "Government disaster response, infrastructure monitoring, and logistics planning for NER"
  prohibited_use: "Surveillance of individuals, military targeting, or commercial exploitation without appropriate licenses"
  privacy: "No personally identifiable information in satellite imagery at used resolutions"
  bias_considerations:
    - "Urban areas may be over-represented in training data relative to remote NER regions"
    - "Disaster events in accessible areas are better documented than those in remote locations"
    - "International datasets may not fully represent NER terrain and vegetation characteristics"
  data_sovereignty: "Indian satellite data (ISRO) processed within Indian jurisdiction for Indian government use"
